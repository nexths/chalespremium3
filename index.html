<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Chalés Premium | Santa Isabel - Tour Virtual 360°</title>

<meta
name="description"
content="Conheça nossos chalés exclusivos em Santa Isabel através de uma experiência virtual imersiva."
>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap"
rel="stylesheet">

<style>

/* =========================================
   RESET E ESTRUTURA FIXA
========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    touch-action: pan-y;
    overflow: hidden;
    position: fixed;
}

body {
    background: #080807;
    color: #fff;
    font-family: "DM Sans", sans-serif;
}

a {
    color: inherit;
    text-decoration: none;
}


/* =========================================
   CAMADA DA HERO (DIREÇÕES DE ANIMAÇÃO)
========================================= */

.hero {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
    background:
        linear-gradient(
            90deg,
            rgba(4,4,3,.88) 0%,
            rgba(4,4,3,.62) 28%,
            rgba(4,4,3,.20) 58%,
            rgba(4,4,3,.42) 100%
        ),
        linear-gradient(
            0deg,
            rgba(0,0,0,.88) 0%,
            rgba(0,0,0,.05) 58%,
            rgba(0,0,0,.30) 100%
        ),
        url("hero.webp");

    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    transform: translateZ(0);
}

/* Animação 1: Entra vindo da direita para a esquerda (Avançar) */
@keyframes slideFromRight {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
}

/* Animação 2: Entra vindo da esquerda para a direita (Voltar) */
@keyframes slideFromLeft {
    from { transform: translateX(-100%); }
    to { transform: translateX(0); }
}

.slide-right {
    animation: slideFromRight 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.slide-left {
    animation: slideFromLeft 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}


/* =========================================
   TEXTURA SUTIL
========================================= */

.hero::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
        radial-gradient(
            circle at center,
            transparent 30%,
            rgba(0,0,0,.18) 100%
        );
}


/* =========================================
   TOPBAR (FIXA)
========================================= */

.topbar {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 34px 54px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
}

.logo {
    display: flex;
    align-items: center;
    gap: 13px;
    font-size: 11px;
    letter-spacing: 4px;
    font-weight: 500;
    text-transform: uppercase;
}

.logo-mark {
    width: 26px;
    height: 22px;
    position: relative;
}

.logo-mark::before {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    border-left: 1px solid #c9a45c;
    border-top: 1px solid #c9a45c;
    transform: rotate(45deg);
    left: 4px;
    top: 2px;
}

.logo-mark::after {
    content: "";
    position: absolute;
    width: 16px;
    height: 1px;
    background: #c9a45c;
    left: 5px;
    bottom: 2px;
}

.top-right {
    display: flex;
    align-items: center;
    gap: 28px;
    font-size: 9px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: .9;
}

.menu {
    width: 30px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    cursor: pointer;
}

.menu span {
    height: 1px;
    width: 100%;
    background: white;
    transition: .3s ease;
}

.menu span:last-child {
    width: 65%;
    margin-left: auto;
}


/* =========================================
   CONTEÚDO PRINCIPAL (TEXTOS EM CASCATA)
========================================= */

.content {
    position: absolute;
    z-index: 5;
    left: 7%;
    top: 50%;
    transform: translateY(-54%);
    max-width: 700px;
}

@keyframes textReveal {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.animate-text .overline {
    animation: textReveal 0.8s ease 0.3s both;
}

.animate-text .title-small {
    animation: textReveal 0.8s ease 0.45s both;
}

.animate-text .title {
    animation: textReveal 0.8s ease 0.6s both;
}

.animate-text .gold-line {
    animation: textReveal 0.8s ease 0.75s both;
}

.animate-text .subtitle {
    animation: textReveal 0.8s ease 0.9s both;
}

.animate-text .explore {
    animation: textReveal 0.8s ease 1.05s both;
}


/* ESTILOS DOS TEXTOS */

.overline {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 23px;
    font-size: 10px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #d4b16b;
}

.overline::after {
    content: "";
    width: 38px;
    height: 1px;
    background: #c9a45c;
}

.title-small {
    font-family: "Playfair Display", serif;
    font-size: clamp(24px, 3vw, 40px);
    font-weight: 400;
    letter-spacing: 5px;
    color: #d4b16b;
    margin-bottom: 2px;
}

.title {
    font-family: "Playfair Display", serif;
    font-size: clamp(45px, 6vw, 95px);
    line-height: .9;
    font-weight: 400;
    letter-spacing: -2px;
    margin-left: -7px;
}

.gold-line {
    width: 68px;
    height: 1px;
    background: #c9a45c;
    margin-top: 36px;
    margin-bottom: 25px;
}

.subtitle {
    font-family: "Playfair Display", serif;
    font-size: clamp(16px, 1.4vw, 20px);
    font-weight: 400;
    color: rgba(255,255,255,.88);
    letter-spacing: .4px;
}

.subtitle em {
    font-style: italic;
    color: #d6bd91;
}


/* =========================================
   BOTÃO EXPLORAR 360
========================================= */

.explore {
    display: inline-block;
    margin-top: 38px;
    padding: 18px 36px;
    border: 1px solid rgba(201,164,92,0.5);
    background: transparent;
    color: #ffffff;
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
    transition: color 0.4s ease, border-color 0.4s ease, transform 0.4s ease;
}

.explore::before {
    content: "";
    position: absolute;
    inset: 0;
    background: #c9a45c;
    transform: scaleX(0);
    transform-origin: right;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: -1;
}

.explore:hover {
    color: #080807;
    border-color: #c9a45c;
    transform: translateY(-3px);
}

.explore:hover::before {
    transform: scaleX(1);
    transform-origin: left;
}


/* =========================================
   CARDS DOS CHALÉS (FIXOS NA BASE)
========================================= */

.chalets {
    position: absolute;
    z-index: 7;
    right: 5%;
    bottom: 58px;
    width: min(650px, 48%);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

@keyframes cardInitialReveal {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.card-1 { animation: cardInitialReveal 0.8s ease 1.1s both; }
.card-2 { animation: cardInitialReveal 0.8s ease 1.25s both; }
.card-3 { animation: cardInitialReveal 0.8s ease 1.4s both; }

.card {
    position: relative;
    min-height: 130px;
    padding: 17px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.22);
    background: rgba(8,8,7,.28);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    cursor: pointer;
    transition: transform .45s ease, border-color .45s ease, background .45s ease;
}

.card::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background-size: cover;
    background-position: center;
    opacity: .28;
    transform: scale(1.08);
}

.card-sunset::before { background-image: url("hero.webp"); }
.card-piramide::before { background-image: url("hero-piramide.webp"); }
.card-santorini::before { background-image: url("hero-santorini.webp"); }

.card::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.80));
}

.card:hover, .card.active {
    transform: translateY(-7px);
    border-color: rgba(201,164,92,.8);
    background: rgba(8,8,7,.12);
}

.card-number {
    font-family: "Playfair Display", serif;
    font-size: 25px;
    color: #d4b16b;
    font-weight: 400;
}

.card-name {
    position: absolute;
    bottom: 18px;
    left: 17px;
    font-family: "Playfair Display", serif;
    font-size: 13px;
    font-weight: 400;
}


/* =========================================
   INDICADORES MOBILE (FIXOS)
========================================= */

.mobile-dots {
    display: none;
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 7;
    gap: 8px;
    align-items: center;
}

.dot {
    width: 25px;
    height: 3px;
    background: rgba(255, 255, 255, 0.3);
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.4s ease, width 0.4s ease;
}

.dot.active {
    background: #c9a45c;
    width: 45px;
}


/* =========================================
   INDICADOR LATERAL & RODAPÉ (FIXOS)
========================================= */

.side-scroll {
    position: absolute;
    right: 31px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    font-size: 8px;
    letter-spacing: 4px;
    writing-mode: vertical-rl;
    text-transform: uppercase;
    opacity: .5;
}

.side-line {
    height: 55px;
    width: 1px;
    background: rgba(255,255,255,.65);
}

.bottom-label {
    position: absolute;
    left: 7%;
    bottom: 35px;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 15px;
    font-size: 8px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: .55;
}

.bottom-label::before,
.bottom-label::after {
    content: "";
    width: 45px;
    height: 1px;
    background: rgba(255,255,255,.4);
}


/* =========================================
   RESPONSIVO
========================================= */
@media (max-width: 1000px) {
    .topbar { padding: 27px 30px; }
    .content { left: 6%; }
    .side-scroll { display: none; }
}

@media (max-width: 700px) {
    .hero { min-height: 100svh; height: 100svh; background-size: cover; }
    .topbar { padding: 23px 20px; }
    .content { left: 20px; right: 20px; top: 60%; transform: translateY(-50%); max-width: none; }
    .chalets { display: none; }
    .mobile-dots { display: flex; }
    .bottom-label { display: none; }
}
</style>

</head>

<body>

<main class="hero animate-text" id="heroBackground">

    <!-- TOPO FIXO -->
    <header class="topbar">
        <a href="#" class="logo">
            <span class="logo-mark"></span>
            <span>Chalés • Santa Isabel</span>
        </a>
        <div class="top-right">
            <span>Tour Virtual 360°</span>
            <div class="menu">
                <span></span>
                <span></span>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <section class="content animate-text" id="contentBox">
        <div class="overline">EXPERIÊNCIA EXCLUSIVA</div>
        <div class="title-small" id="chaletPreTitle">CHALÉ</div>
        <h1 class="title" id="chaletTitle">Sunset</h1>
        <div class="gold-line"></div>
        <p class="subtitle" id="chaletSubtitle">
            Uma experiência para <em>desacelerar.</em>
        </p>
        <a href="https://nexths.github.io/chale-sunset/" class="explore" id="exploreBtn" target="_blank">
            <span>Explorar 360°</span>
        </a>
    </section>

    <!-- CARDS DOS CHALÉS -->
    <section class="chalets" id="chales">
        <div class="card card-sunset card-1 active" onclick="mudarParaChale(0, 'next')" data-name="Sunset" data-pre="CHALÉ" data-sub="Uma experiência para <em>desacelerar.</em>" data-img="hero.webp" data-pos="center center" data-link="https://nexths.github.io/chale-sunset/">
            <span class="card-number">01</span>
            <span class="card-name">Chalé Sunset</span>
        </div>
        <div class="card card-piramide card-2" onclick="mudarParaChale(1, 'next')" data-name="Pirâmide Vidro" data-pre="CHALÉ" data-sub="Arquitetura única em harmonia com a <em>natureza.</em>" data-img="hero-piramide.webp" data-pos="80% center" data-link="https://nexths.github.io/piramidevidro/">
            <span class="card-number">02</span>
            <span class="card-name">Pirâmide Vidro</span>
        </div>
        <div class="card card-santorini card-3" onclick="mudarParaChale(2, 'next')" data-name="Cupule Santorini" data-pre="CHALÉ" data-sub="Um refúgio exclusivo com vista <em>panorâmica.</em>" data-img="hero-santorini.webp" data-pos="20% center" data-link="https://nexths.github.io/cupulesantorini/">
            <span class="card-number">03</span>
            <span class="card-name">Cupule Santorini</span>
        </div>
    </section>

    <!-- BARRINHAS DE NAVEGAÇÃO MOBILE -->
    <div class="mobile-dots" id="mobileDots">
        <span class="dot active" onclick="mudarParaChale(0, 'next')"></span>
        <span class="dot" onclick="mudarParaChale(1, 'next')"></span>
        <span class="dot" onclick="mudarParaChale(2, 'next')"></span>
    </div>

    <!-- INDICADOR LATERAL -->
    <div class="side-scroll">
        <span class="side-line"></span>
        Explore
    </div>

    <!-- RODAPÉ -->
    <div class="bottom-label">
        Escolha seu chalé e viva essa experiência
    </div>

</main>

<!-- SCRIPT COM DIREÇÃO INTELIGENTE DE SLIDE -->
<script>
const chaletsData = [
    { name: "Sunset", pre: "CHALÉ", sub: "Uma experiência para <em>desacelerar.</em>", img: "hero.webp", pos: "center center", link: "https://nexths.github.io/chale-sunset/" },
    { name: "Pirâmide Vidro", pre: "CHALÉ", sub: "Arquitetura única em harmonia com a <em>natureza.</em>", img: "hero-piramide.webp", pos: "80% center", link: "https://nexths.github.io/piramidevidro/" },
    { name: "Cupule Santorini", pre: "CHALÉ", sub: "Um refúgio exclusivo com vista <em>panorâmica.</em>", img: "hero-santorini.webp", pos: "20% center", link: "https://nexths.github.io/cupulesantorini/" }
];

let currentIndex = 0;
let slideInterval;

function mudarParaChale(index, direction) {
    currentIndex = index;
    atualizarInterface(direction);
    clearInterval(slideInterval);
    iniciarSlideAutomatico();
}

function atualizarInterface(direction) {
    const cards = document.querySelectorAll('.card');
    const dots = document.querySelectorAll('.dot');
    const hero = document.getElementById('heroBackground');
    const contentBox = document.getElementById('contentBox');
    
    const preTitle = document.getElementById('chaletPreTitle');
    const title = document.getElementById('chaletTitle');
    const subtitle = document.getElementById('chaletSubtitle');
    const exploreBtn = document.getElementById('exploreBtn');

    cards.forEach(c => c.classList.remove('active'));
    if(cards[currentIndex]) cards[currentIndex].classList.add('active');

    dots.forEach(d => d.classList.remove('active'));
    if(dots[currentIndex]) dots[currentIndex].classList.add('active');

    const data = chaletsData[currentIndex];

    // Alterna a direção da animação da foto conforme o sentido do slide
    hero.classList.remove('slide-right', 'slide-left');
    void hero.offsetWidth; 
    if (direction === 'prev') {
        hero.classList.add('slide-left'); // Vem da esquerda para a direita
    } else {
        hero.classList.add('slide-right'); // Vem da direita para a esquerda
    }

    // Textos se atualizam com animação
    contentBox.classList.remove('animate-text');
    void contentBox.offsetWidth;
    contentBox.classList.add('animate-text');

    // Altera as informações textuais e de imagem
    hero.style.backgroundImage = `linear-gradient(90deg, rgba(4,4,3,.88) 0%, rgba(4,4,3,.62) 28%, rgba(4,4,3,.20) 58%, rgba(4,4,3,.42) 100%), linear-gradient(0deg, rgba(0,0,0,.88) 0%, rgba(0,0,0,.05) 58%, rgba(0,0,0,.30) 100%), url("${data.img}")`;
    hero.style.backgroundPosition = data.pos;
    
    preTitle.textContent = data.pre;
    title.textContent = data.name;
    subtitle.innerHTML = data.sub;
    exploreBtn.setAttribute('href', data.link);
}

function iniciarSlideAutomatico() {
    slideInterval = setInterval(() => {
        currentIndex = (currentIndex + 1) % chaletsData.length;
        atualizarInterface('next');
    }, 8000);
}

iniciarSlideAutomatico();

// SUPORTE AO TOQUE COM DETECÇÃO EXATA DE DIREÇÃO
let touchStartX = 0;
let touchEndX = 0;
const heroElement = document.getElementById('heroBackground');

heroElement.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
}, {passive: true});

heroElement.addEventListener('touchend', e => {
    touchEndX = e.changedTouches[0].screenX;
    tratarSwipe();
}, {passive: true});

function tratarSwipe() {
    const limiteSwipe = 40;
    if (touchEndX < touchStartX - limiteSwipe) {
        // Arrastou para a esquerda -> Avança o slide (foto vem da direita)
        currentIndex = (currentIndex + 1) % chaletsData.length;
        mudarParaChale(currentIndex, 'next');
    } else if (touchEndX > touchStartX + limiteSwipe) {
        // Arrastou para a direita -> Volta o slide (foto vem da esquerda)
        currentIndex = (currentIndex - 1 + chaletsData.length) % chaletsData.length;
        mudarParaChale(currentIndex, 'prev');
    }
}
</script>

</body>
</html>
